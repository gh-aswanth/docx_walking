version: 2
updates:
  # The workflows pin action versions; this is what keeps those pins current
  # instead of letting them rot until something breaks.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    groups:
      dev-tooling:
        patterns: ["ruff", "mypy", "isort", "pytest*", "pre-commit", "pyflakes"]
