name: CI

# Deliberately NOT triggered by push or pull_request. `deploy.yml` runs on both
# and calls this workflow as its gate, so a direct trigger would start a second,
# identical run -- and because both landed in the same concurrency group, the
# two cancelled each other ("Cancelled after 1s" on every job).
#
# One CI run per event, and it is the gate that decides whether the deploy or
# the release proceeds.
on:
  workflow_dispatch:
  workflow_call:

# A new push supersedes the run it interrupted; nothing is learned by finishing
# a check against code that has already moved on.
# `github.workflow` is the *calling* workflow's name when this runs via
# workflow_call, so Deploy's gate and Release's gate never collide.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Reproducible resolution: every `uv sync` below passes `--locked`, which asserts
# uv.lock is already current for pyproject.toml and fails if it is not. Do NOT
# also set UV_FROZEN here -- `--frozen` means "use the lock without checking it",
# so uv rejects the pair outright:
#     error: the argument `--locked` cannot be used with `UV_FROZEN`

jobs:
  test:
    name: tests · py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python }}
      - run: uv sync --locked

      - name: pytest
        run: uv run pytest -q

      # The examples are executable documentation: one that stops running is a
      # README that has started lying.
      - name: examples
        run: uv run python examples/run_all.py

  build:
    name: build · install · smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: build wheel and sdist
        run: uv build

      - name: metadata is well formed
        run: uvx twine check --strict dist/*

      # Prove the wheel stands on its own: a fresh interpreter, only the
      # declared dependencies, and no repo on sys.path.
      - name: install the wheel into a clean environment
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl

      - name: the installed package works
        run: |
          cd /tmp
          /tmp/clean/bin/docx-redline --version
          /tmp/clean/bin/python -m docx_redline --version
          /tmp/clean/bin/python - <<'PY'
          from docx_redline import ParagraphIndex, RedlineEdit, Redliner
          import importlib.metadata as md
          meta = md.metadata("docx-redline")
          assert meta["License-Expression"] == "MPL-2.0", meta["License-Expression"]
          src = "${{ github.workspace }}/examples/data/Sample_Software_License_Agreement.docx"
          rl = Redliner(src, author="CI")
          index = ParagraphIndex(rl)
          report = index.apply([RedlineEdit(19, "thirty (30) days", "forty-five (45) days")])
          assert len(report.applied) == 1, report.summary()
          print("wheel smoke test ok:", len(index), "paragraphs,", meta["License-Expression"])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  # Lint, format, imports, types, docs, file hygiene and the lockfile -- all of
  # it. Running pre-commit rather than restating its commands is what keeps a
  # green local commit from being a red CI run.
  #
  # pytest and the examples are hooks too, but the `test` job above already runs
  # them across six interpreter/OS combinations. Running them a seventh time here
  # would tell us nothing, so they are skipped.
  quality:
    name: lint · format · types · docs
    runs-on: ubuntu-latest
    env:
      SKIP: pytest,examples
      RUFF_OUTPUT_FORMAT: github    # findings annotate the diff, not just the log
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: every hook, on every file
        run: uv run pre-commit run --all-files --show-diff-on-failure
