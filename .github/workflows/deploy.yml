name: Deploy

# Every push to main, once the full gate is green.
#
# Vercel's own Git integration would deploy on push too, but it deploys
# *regardless* of whether the tests passed. Driving the CLI from here instead
# means a red build never reaches production.
on:
  push:
    branches: [main]
  pull_request:            # preview URL on every PR
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: quality gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write     # to leave the preview URL on the PR
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      # Copying an id out of a file usually brings a newline with it, and GitHub
      # stores secrets verbatim. A trailing \n turns a valid id into an invalid
      # one, and the CLI reports it as "Could not retrieve Project Settings" --
      # which sounds like a permissions problem and is not. Strip it here.
      - name: read and normalise the ids
        run: |
          org=$(printf %s "${{ secrets.VERCEL_ORG_ID }}"     | tr -d '[:space:]')
          prj=$(printf %s "${{ secrets.VERCEL_PROJECT_ID }}" | tr -d '[:space:]')
          missing=
          [ -n "${{ secrets.VERCEL_TOKEN }}" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$org" ]                        || missing="$missing VERCEL_ORG_ID"
          [ -n "$prj" ]                        || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing"
            echo "Run \`vercel link\` locally, then copy the ids out of .vercel/project.json"
            exit 1
          fi
          echo "VERCEL_ORG_ID=$org"     >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=$prj" >> "$GITHUB_ENV"
          echo "org id ${#org} chars, project id ${#prj} chars"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --global vercel@latest

      # `vercel pull` fails with the same opaque message whether the ids are
      # wrong or the token simply cannot see the project. Say which.
      - name: the token can reach this project
        run: |
          echo "token belongs to: $(vercel whoami --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)"
          echo "teams it can see:"
          vercel teams ls --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | sed 's/^/  /' || true
          if ! vercel project ls --scope="$VERCEL_ORG_ID" \
                 --token=${{ secrets.VERCEL_TOKEN }} >/dev/null 2>&1; then
            echo "::error::the token cannot list projects in $VERCEL_ORG_ID."
            echo "The orgId starts with 'team_', so the project is team-owned:"
            echo "create the token with that TEAM selected as its scope, not your"
            echo "personal account -- https://vercel.com/account/settings/tokens"
            exit 1
          fi

      - name: pull the environment
        run: |
          vercel pull --yes \
            --environment=${{ github.event_name == 'push' && 'production' || 'preview' }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      # Built on Vercel, not here. `vercel build` + `--prebuilt` looked
      # attractive -- the build happens where we can see it -- but it records a
      # filePathMap of the whole working directory, and .vercelignore then
      # strips files that map still references:
      #     ENOENT: lstat '/vercel/path0/.github/dependabot.yml'
      # Building remotely keeps the manifest and the upload consistent, and
      # Vercel's builders already have the uv their Python runtime requires.
      - name: deploy
        id: deploy
        run: |
          url=$(vercel deploy \
            ${{ github.event_name == 'push' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      # A deployment that 500s is not a deployment. Check before declaring it.
      #
      # If Deployment Protection is on, Vercel answers every request with a 302
      # to its SSO login and the app is never reached. Send the automation
      # bypass header when the secret is set; otherwise say plainly that the
      # 302 is the protection layer, not the app.
      - name: the deployment actually serves
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          for path in /healthz / /e/01_quickstart; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 \
                   ${BYPASS:+-H "x-vercel-protection-bypass: $BYPASS"} \
                   "${{ steps.deploy.outputs.url }}$path")
            echo "  $code  $path"
            if [ "$code" = "302" ] || [ "$code" = "401" ]; then
              echo "::error::$path returned $code -- that is Vercel Deployment Protection,"
              echo "not the application. The deploy itself succeeded. Either:"
              echo "  a) turn it off:  Vercel > Project > Settings > Deployment Protection"
              echo "                   > Vercel Authentication > Disabled   (a public demo)"
              echo "  b) or keep it and add the bypass: same page > Protection Bypass for"
              echo "     Automation > Create, then store it as the repository secret"
              echo "     VERCEL_AUTOMATION_BYPASS_SECRET"
              exit 1
            fi
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done

      - name: comment the preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\n**Preview:** ${url}\n\nEvery example runs live there.`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
