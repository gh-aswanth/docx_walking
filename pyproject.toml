[project]
name = "docx-redline"
description = "Production-grade Word tracked changes (redlines) for .docx files"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# version: single-sourced from docx_redline/__init__.py, see [tool.hatch.version]
# readme:  README.md with its relative links absolutised, see the fancy-pypi hook
dynamic = ["version", "readme"]
authors = [{ name = "Aswanth", email = "aswanth.babu@outlook.com" }]
keywords = [
    "docx",
    "word",
    "ooxml",
    "redline",
    "tracked-changes",
    "revisions",
    "contracts",
    "python-docx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]
dependencies = [
    "lxml>=6.1.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
]

[project.urls]
# These become the sidebar links on the PyPI project page.
Homepage = "https://github.com/gh-aswanth/docx_walking"
Repository = "https://github.com/gh-aswanth/docx_walking"
Issues = "https://github.com/gh-aswanth/docx_walking/issues"
Documentation = "https://github.com/gh-aswanth/docx_walking/tree/main/docs"
Changelog = "https://github.com/gh-aswanth/docx_walking/releases"

[project.optional-dependencies]
# Only needed for `--reviewer claude` / `--reviewer openai`. Both SDKs are
# imported lazily inside the reviewers, so the core install stays offline and
# the default rule-based reviewer needs neither.
llm = [
    "anthropic>=1.2.0",
    "openai>=3.6.0",
]

# The demo server in docx_redline/web. Its templates, stylesheet and the example
# scripts it runs all ship inside the wheel, so this is the whole thing:
#     pip install "docx-redline[web]" && docx-redline serve
web = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
docx-redline = "docx_redline.cli:_entry"
# Same command under the module spelling, so `uv run docx_redline ...` works
# alongside `uv run docx-redline ...` and `python -m docx_redline ...`.
docx_redline = "docx_redline.cli:_entry"

[dependency-groups]
# `uv sync` must give a venv that can run the whole suite: tests/test_reviewers.py
# exercises the Claude and OpenAI plumbing, so it needs their SDKs. Referencing
# the extra rather than restating the pins keeps one source of truth.
dev = [
    "docx-redline[llm,web]",
    "httpx>=0.28",   # tests/test_reviewers.py mocks both SDKs through it
    "isort>=9.0.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pyflakes>=3.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.version]
# One definition of the version, in the package itself, so an install and
# `docx_redline.__version__` can never disagree.
path = "docx_redline/__init__.py"

# PyPI renders the README with no access to the repository, so every relative
# path in it -- 9 images and 32 links -- resolves to nothing. Rather than paste
# absolute URLs into the file (which would then point at upstream `main` even
# when the README is read on a fork or a branch), rewrite them here, at build
# time. GitHub keeps working relative links; PyPI gets absolute ones.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# Images first: they need raw.githubusercontent, not the blob viewer.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/gh-aswanth/docx_walking/main/\2)'

# Then every remaining relative target. Matching on `](...)` alone rather than
# on the whole link also catches a badge, where an image is nested inside the
# link and the label itself contains brackets: [![alt](img)](LICENSE).
# The lookahead skips the image URLs just written above.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)]+)\)'
replacement = '](https://github.com/gh-aswanth/docx_walking/blob/main/\1)'

[tool.hatch.build.targets.wheel]
# The subpackages come along with it; hatchling recurses, and non-Python files
# inside the package (web/templates, web/static) are included as package data.
packages = ["docx_redline"]

[tool.hatch.build.targets.wheel.force-include]
# The demo runs the real example scripts. They live at the repository root so
# the tests, CI and the docs can reach them; map them into the package so an
# installed `docx-redline[web]` is self-contained rather than depending on a
# checkout that is not there.
"examples" = "docx_redline/web/examples"

[tool.hatch.build.targets.sdist]
# Ship what someone needs to verify the library: the package, the suite that
# proves it, the worked example, and the docs the README links to.
include = [
    "docx_redline",
    "tests",
    "examples",
    "docs",
    "webapp",
    "api",
    "vercel.json",
    "README.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "examples/output",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# ---------------------------------------------------------------------------
# code quality
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["examples/output"]

[tool.ruff.lint]
# PLW1514 is a preview rule; nothing else here depends on preview.
preview = true
explicit-preview-rules = true
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort -- import ordering, enforced here rather than by a second tool
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PTH",  # prefer pathlib
    "RUF",  # ruff's own
    # Text IO without an explicit encoding uses the *locale* codec. On Windows
    # that is cp1252, which decodes UTF-8 smart quotes into mojibake without
    # raising -- silent corruption in a library whose whole subject is quoted
    # legal prose. This rule is why that cannot come back.
    "PLW1514",
]
ignore = [
    # This library exists to edit legal prose. Smart quotes, en dashes and
    # non-breaking spaces are the *subject matter* -- `fold()` is built to
    # normalise exactly these -- so flagging them as ambiguous is noise.
    "RUF001", "RUF002", "RUF003",
    # `open()` and `os.path` are fine where the surrounding code already uses them.
    "PTH123",
    # A trailing `else` after `return` often reads better in the branchy
    # planner code than the flattened form.
    "RET505",
]

[tool.ruff.lint.per-file-ignores]
# conftest and the examples put the repo on sys.path before importing from it.
"tests/conftest.py" = ["E402"]
"examples/*.py" = ["E402"]
# The public API module is a re-export surface: unused imports are the point.
"docx_redline/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["docx_redline"]
combine-as-imports = true

[tool.ruff.format]
docstring-code-format = true

[tool.isort]
# Ruff's `I` rules are the source of truth; this block exists so a standalone
# `isort` run agrees with them byte for byte instead of fighting over the file.
profile = "black"
line_length = 100
known_first_party = ["docx_redline"]
combine_as_imports = true
skip_glob = ["examples/output/*"]

[tool.mypy]
python_version = "3.12"
files = ["docx_redline"]
namespace_packages = true
explicit_package_bases = true
# lxml and python-docx ship partial or no stubs; typing their internals is not
# this project's job, so calls into them are untyped rather than errors.
ignore_missing_imports = true
follow_imports = "normal"
# The floor, enforced everywhere today.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true

# ---------------------------------------------------------------------------
# The floor above is enforced everywhere. These three modules are exempted from
# specific codes, each for a stated reason -- not blanket-silenced -- so a new
# error of any other kind still fails the build. Narrowing these is the next
# step, not a permanent state.
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
# Both SDKs return dynamically-shaped response objects, and the reviewers reach
# through them defensively. Typing those would mean vendoring their stubs.
module = "docx_redline.planning.agent"
disable_error_code = ["union-attr", "attr-defined", "arg-type", "assignment", "index"]

[[tool.mypy.overrides]]
# `Reviewer` is a Protocol declaring only `propose`; `emit` and `client` exist
# on the concrete reviewers. Widening the Protocol is the real fix.
module = ["docx_redline.cli", "docx_redline.planning.chunked"]
disable_error_code = ["attr-defined", "union-attr"]

[[tool.mypy.overrides]]
# A clause label is `str | None` while a clause is being constructed and `str`
# once it is in the tree; the narrowing is real but not yet expressed.
module = [
    "docx_redline.structure.clauses",
    "docx_redline.structure.segments",
    "docx_redline.planning.actions",
    "docx_redline.planning.pipeline",
]
disable_error_code = ["arg-type", "index", "misc", "assignment"]
